<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fcfcfc" id="themeColor">
<title>Sifra — AI למתמטיקה</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mathjs@14.6.0/lib/browser/math.js"></script>
<style>
:root{
  --bg:#fcfcfc;
  --sidebar:#f7f7f8;
  --surface:#ffffff;
  --surface-hover:#ececed;
  --composer:#ffffff;
  --text:#141414;
  --muted:#8b8b8b;
  --muted-2:#a5a5a5;
  --line:#e7e7e7;
  --line-strong:#dbdbdb;
  --user:#e8f3fe;
  --icon:#242424;
  --shadow:0 4px 20px rgba(0,0,0,.06);
  --shadow-composer:0 8px 30px rgba(0,0,0,.07);
  --sidebar-width:260px;
  --danger:#bb2d3b;
}
html[data-theme="dark"]{
  --bg:#111111;
  --sidebar:#111111;
  --surface:#181818;
  --surface-hover:#202020;
  --composer:#181818;
  --text:#eeeeee;
  --muted:#a7a7a7;
  --muted-2:#858585;
  --line:#242424;
  --line-strong:#303030;
  --user:#242424;
  --icon:#eeeeee;
  --shadow:0 4px 20px rgba(0,0,0,.22);
  --shadow-composer:0 10px 35px rgba(0,0,0,.25);
  --danger:#ff7f87;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:"Huninn",ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  font-size:16px;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,textarea,input{font:inherit}
button{color:inherit;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,textarea:focus-visible,input:focus-visible{
  outline:2px solid color-mix(in srgb,var(--text) 35%,transparent);
  outline-offset:2px;
}
svg{display:block}
.app{
  height:100dvh;
  display:grid;
  grid-template-columns:var(--sidebar-width) minmax(0,1fr);
  background:var(--bg);
  direction:ltr;
  transition:grid-template-columns .2s ease;
}
body.sidebar-collapsed .app{grid-template-columns:0 minmax(0,1fr)}
.sidebar{
  direction:ltr;
  position:relative;
  min-width:0;
  width:var(--sidebar-width);
  height:100dvh;
  overflow:hidden;
  border-left:0;
  border-right:1px solid var(--line);
  background:var(--sidebar);
  display:flex;
  flex-direction:column;
  transition:transform .2s ease,opacity .2s ease;
  z-index:30;
}
html[data-theme="dark"] .sidebar{border-right-color:#181818}
body.sidebar-collapsed .sidebar{
  transform:translateX(-100%);
  opacity:0;
  pointer-events:none;
}
.sidebar-head{
  height:52px;
  padding:10px 13px 6px 15px;
  display:flex;
  align-items:center;
  gap:6px;
  direction:ltr;
  flex:none;
}
.brand{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
  margin-right:auto;
  font-size:17px;
  font-weight:700;
  letter-spacing:-.01em;
}
.brand-mark{
  width:28px;
  height:28px;
  object-fit:contain;
  display:block;
  flex:none;
}
.icon-btn{
  width:32px;
  height:32px;
  border:0;
  background:transparent;
  display:grid;
  place-items:center;
  border-radius:8px;
  color:var(--icon);
  flex:none;
}
.icon-btn:hover{background:var(--surface-hover)}
.sidebar-nav{
  padding:9px 10px 0;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.nav-btn{
  height:40px;
  border:0;
  background:transparent;
  border-radius:8px;
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  padding:0 9px;
  color:var(--text);
  font-size:15px;
  font-weight:500;
  text-align:left;
  direction:ltr;
}
.nav-btn span{direction:rtl;unicode-bidi:plaintext}
.nav-btn:hover{background:var(--surface-hover)}
.nav-btn svg{flex:none}
.more-panel{
  display:none;
  margin:3px 4px 0;
  padding:5px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--surface);
  box-shadow:var(--shadow);
}
.more-panel.open{display:block}
.more-item{
  width:100%;
  height:36px;
  border:0;
  background:transparent;
  border-radius:7px;
  padding:0 9px;
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--text);
  font-size:14px;
}
.more-item:hover{background:var(--surface-hover)}
.sidebar-sections{
  padding:13px 10px;
  overflow-y:auto;
  min-height:0;
  flex:1;
}
.section-toggle{
  width:100%;
  border:0;
  background:transparent;
  color:var(--muted);
  height:40px;
  padding:0 6px;
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:4px;
  font-size:14px;
  font-weight:500;
  direction:ltr;
  text-align:left;
}
.section-toggle span{direction:rtl;unicode-bidi:plaintext}
.section-toggle:hover{color:var(--text);background:var(--surface-hover)}
.section-toggle svg{width:14px;height:14px}
.sidebar-footer{
  flex:none;
  padding:8px 9px 10px;
  border-top:1px solid transparent;
}
.profile{
  min-height:48px;
  padding:6px 7px;
  border-radius:9px;
  display:flex;
  align-items:center;
  gap:9px;
  direction:ltr;
}
.profile:hover{background:var(--surface-hover)}
.avatar{
  width:30px;height:30px;border-radius:50%;
  display:grid;place-items:center;
  background:#c7ccd1;color:#fff;
  font-size:11px;font-weight:700;
  flex:none;
}
.profile-copy{
  min-width:0;
  flex:1;
  line-height:1.1;
  direction:ltr;
}
.profile-name{
  font-size:14px;
  font-weight:500;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.profile-plan{
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
}
.profile-action{
  width:30px;height:30px;border:0;background:transparent;border-radius:7px;
  display:grid;place-items:center;color:var(--muted)
}
.profile-action:hover{background:var(--surface)}

.sidebar-footer{position:relative}
.account-trigger{
  width:100%;
  border:0;
  background:transparent;
  text-align:left;
}
.profile-name{direction:rtl;unicode-bidi:plaintext}
.profile-chevron{transition:transform .16s ease;color:var(--muted);flex:none}
.account-trigger.open .profile-chevron{transform:rotate(180deg)}
.account-menu{
  display:none;
  position:absolute;
  left:8px;
  bottom:64px;
  width:calc(100% - 16px);
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  box-shadow:0 14px 45px rgba(0,0,0,.13);
  overflow:hidden;
  z-index:60;
  direction:ltr;
}
.account-menu.open{display:block;animation:accountIn .16s ease-out}
@keyframes accountIn{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
.account-menu-head{
  min-height:58px;
  padding:10px 12px;
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid var(--line);
}
.account-menu-copy{min-width:0;flex:1}
.account-menu-title{font-size:14px;font-weight:600;direction:rtl;unicode-bidi:plaintext}
.account-menu-sub{font-size:12px;color:var(--muted);margin-top:3px}
.usage-card{
  margin:12px;
  padding:12px;
  background:color-mix(in srgb,var(--sidebar) 86%,var(--surface));
  border-radius:10px;
}
.usage-title{font-size:14px;font-weight:600;margin-bottom:10px;direction:rtl;unicode-bidi:plaintext}
.usage-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}
.usage-row span:first-child{direction:rtl;unicode-bidi:plaintext}
.usage-value{color:var(--muted);font-size:12px}
.usage-track{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:7px 0 1px}
.usage-fill{height:100%;width:0%;background:var(--text);border-radius:inherit;transition:width .3s ease}
.account-upgrade{
  width:calc(100% - 24px);
  margin:0 12px 12px;
  height:34px;
  border:1px solid #ff6846;
  color:#ff5a36;
  background:transparent;
  border-radius:8px;
  font-size:13px;
}
.account-upgrade:hover{background:color-mix(in srgb,#ff6846 8%,transparent)}
.account-menu-section{padding:7px 7px;border-top:1px solid var(--line)}
.account-menu-label{padding:5px 7px 4px;color:var(--muted);font-size:11px;direction:rtl;unicode-bidi:plaintext}
.account-menu-row{
  width:100%;min-height:36px;border:0;background:transparent;border-radius:7px;padding:0 8px;
  display:flex;align-items:center;gap:10px;text-align:left;color:var(--text);font-size:13px;
}
.account-menu-row:hover{background:var(--surface-hover)}
.account-menu-row span{direction:rtl;unicode-bidi:plaintext}
.main{
  direction:rtl;
  min-width:0;
  height:100dvh;
  position:relative;
  display:flex;
  flex-direction:column;
  background:var(--bg);
  overflow:hidden;
}
.topbar{
  height:52px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:7px 14px 5px 15px;
  direction:ltr;
  z-index:10;
}
.topbar-left,.topbar-right{display:flex;align-items:center;gap:7px}
.model-switch{
  display:flex;
  align-items:stretch;
  gap:3px;
  padding:3px;
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:13px;
  box-shadow:0 3px 14px rgba(0,0,0,.14);
}
.model-option{
  min-width:108px;
  min-height:38px;
  border:0;
  background:transparent;
  color:var(--muted);
  border-radius:10px;
  padding:5px 9px 4px;
  text-align:left;
  line-height:1.05;
  transition:background .16s ease,color .16s ease,transform .16s ease;
}
.model-option:hover{background:var(--surface-hover);color:var(--text)}
.model-option.active{
  background:var(--surface-hover);
  color:var(--text);
  box-shadow:inset 0 0 0 1px var(--line-strong),0 1px 4px rgba(0,0,0,.08);
}
.model-option:active{transform:scale(.985)}
.model-name{display:block;font-size:12px;font-weight:600;letter-spacing:.01em}
.model-info{display:block;margin-top:3px;font-size:9.5px;color:var(--muted);white-space:nowrap}
.model-option.active .model-info{color:var(--muted)}
.reopen-sidebar{display:none}
body.sidebar-collapsed .reopen-sidebar{display:grid}
.share-btn{
  border:0;
  background:transparent;
  height:34px;
  border-radius:8px;
  padding:0 9px;
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--text);
  font-size:14px;
}
.share-btn:hover{background:var(--surface-hover)}
.home{
  flex:1;
  overflow:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 24px 135px;
}
.home-inner{
  width:min(760px,100%);
  transform:translateY(-38px);
}
.home h1{
  margin:0 0 24px;
  text-align:center;
  font-size:34px;
  font-weight:600;
  letter-spacing:-.025em;
}
.home-kicker{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  margin-bottom:10px;
}
.home-kicker .green{
  display:inline-block;width:7px;height:7px;border-radius:50%;background:#12a150;margin-left:7px;
}
.chat{
  display:none;
  flex:1;
  overflow-y:auto;
  overscroll-behavior:contain;
  scrollbar-width:thin;
  scrollbar-color:var(--line-strong) transparent;
}
.chat.on{display:block}
.chat-inner{
  width:min(760px,calc(100% - 44px));
  margin:0 auto;
  padding:18px 0 175px;
}
.message-row{
  width:100%;
  margin:0 0 31px;
}
.user-row{
  display:flex;
  justify-content:flex-start;
  direction:rtl;
}
.user-bubble{
  max-width:78%;
  background:var(--user);
  border-radius:18px;
  padding:8px 13px 9px;
  font-size:16px;
  line-height:1.55;
  text-align:right;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  box-shadow:0 1px 0 rgba(0,0,0,.015);
}
.user-images{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:8px;
}
.user-images img{
  width:132px;
  max-height:164px;
  object-fit:cover;
  border-radius:12px;
  border:1px solid var(--line);
}
.assistant-row{
  direction:rtl;
  text-align:right;
}
.assistant-text{
  width:100%;
  font-size:16px;
  line-height:1.78;
  white-space:normal;
  overflow-wrap:anywhere;
}
.assistant-text p{margin:0 0 .85em}
.assistant-text p:last-child{margin-bottom:0}
.assistant-text h1,
.assistant-text h2,
.assistant-text h3,
.assistant-text h4{
  line-height:1.3;
  margin:1.15em 0 .5em;
  letter-spacing:-.015em;
}
.assistant-text h1:first-child,
.assistant-text h2:first-child,
.assistant-text h3:first-child{margin-top:0}
.assistant-text h1{font-size:1.48em}
.assistant-text h2{font-size:1.3em}
.assistant-text h3{font-size:1.14em}
.assistant-text h4{font-size:1.04em}
.assistant-text strong{font-weight:700}
.assistant-text em{font-style:italic}
.assistant-text ul,
.assistant-text ol{
  margin:.55em 0 .9em;
  padding-right:1.55em;
  padding-left:0;
}
.assistant-text li{margin:.18em 0}
.assistant-text li > p{margin:.2em 0}
.assistant-text blockquote{
  margin:.85em 0;
  padding:.2em .9em .2em 0;
  border-right:3px solid var(--line-strong);
  color:var(--muted);
}
.assistant-text hr{
  border:0;
  border-top:1px solid var(--line);
  margin:1.2em 0;
}
.assistant-text code{
  direction:ltr;
  unicode-bidi:isolate;
  font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  font-size:.88em;
  background:var(--surface-hover);
  border:1px solid var(--line);
  border-radius:6px;
  padding:.12em .35em;
}
.assistant-text pre{
  direction:ltr;
  text-align:left;
  overflow:auto;
  margin:.85em 0;
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--surface);
}
.assistant-text pre code{
  padding:0;
  border:0;
  background:transparent;
  font-size:13px;
  white-space:pre;
}
.assistant-text table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  margin:.9em 0 1.1em;
  border:1px solid var(--line-strong);
  border-radius:11px;
  overflow:hidden;
  font-size:.94em;
}
.assistant-text th,
.assistant-text td{
  padding:9px 11px;
  text-align:right;
  vertical-align:top;
  border-bottom:1px solid var(--line);
  border-left:1px solid var(--line);
}
.assistant-text th{
  background:var(--surface-hover);
  font-weight:700;
}
.assistant-text tr:last-child td{border-bottom:0}
.assistant-text th:last-child,
.assistant-text td:last-child{border-left:0}
.assistant-text a{
  color:inherit;
  text-decoration:underline;
  text-underline-offset:2px;
}
.assistant-text .math-inline{
  direction:ltr;
  unicode-bidi:isolate;
  display:inline-block;
  vertical-align:middle;
  margin:0 .1em;
  padding:.06em .12em;
  border-radius:7px;
  cursor:zoom-in;
  transition:background .15s ease;
}
.assistant-text .math-display{
  direction:ltr;
  unicode-bidi:isolate;
  display:block;
  width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  margin:.82em 0;
  padding:12px 10px 14px;
  text-align:center;
  border-radius:12px;
  cursor:zoom-in;
  transition:background .15s ease;
}
.assistant-text .math-inline:hover,
.assistant-text .math-display:hover{
  background:color-mix(in srgb,var(--surface-hover) 72%,transparent);
}
.assistant-text .math-display .katex-display{margin:0}
.assistant-text .math-inline .katex{font-size:1.30em}
.assistant-text .math-display .katex{font-size:1.68em}
.stream-fade{
  animation:streamFadeIn .17s cubic-bezier(.2,.75,.25,1) both;
}
@keyframes streamFadeIn{
  from{opacity:.28;filter:blur(1.35px)}
  to{opacity:1;filter:blur(0)}
}

.sifra-viz{
  width:100%;
  display:flex;
  justify-content:center;
  margin:1.2em 0 1.35em;
  direction:ltr;
}
.viz-card{
  width:min(690px,100%);
  overflow:hidden;
  border:1px solid var(--line-strong);
  border-radius:18px;
  background:var(--surface);
  box-shadow:0 8px 28px rgba(0,0,0,.055);
}
html[data-theme="dark"] .viz-card{
  box-shadow:0 10px 30px rgba(0,0,0,.20);
}
.viz-head{
  min-height:54px;
  padding:10px 14px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.viz-head-copy{
  min-width:0;
  direction:rtl;
  text-align:right;
}
.viz-title{
  color:var(--text);
  font-size:14px;
  font-weight:700;
}
.viz-subtitle{
  margin-top:3px;
  color:var(--muted);
  font-size:12px;
  direction:ltr;
  unicode-bidi:isolate;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.viz-badge{
  flex:none;
  padding:5px 8px;
  border:1px solid var(--line);
  border-radius:999px;
  color:var(--muted);
  font-size:10px;
  background:var(--bg);
}
.viz-body{
  padding:14px;
}
.viz-plot{
  width:100%;
  min-height:310px;
  display:block;
  color:var(--text);
}
.viz-axis-label{
  fill:currentColor;
  opacity:.55;
  font-size:11px;
  font-family:"Huninn",sans-serif;
}
.viz-error{
  padding:28px 18px;
  text-align:center;
  direction:rtl;
  color:var(--muted);
  font-size:13px;
}
.viz-steps{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  direction:rtl;
  padding:8px 2px;
}
.viz-step{
  min-width:110px;
  max-width:180px;
  padding:11px 13px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--bg);
  color:var(--text);
  text-align:center;
  direction:rtl;
  line-height:1.35;
  font-size:13px;
}
.viz-arrow{
  color:var(--muted);
  font-size:18px;
  line-height:1;
}
.viz-numberline{
  width:100%;
  min-height:140px;
  display:block;
  color:var(--text);
}
.viz-triangle{
  width:100%;
  min-height:300px;
  display:block;
  color:var(--text);
}
@media(max-width:560px){
  .viz-body{padding:10px}
  .viz-plot{min-height:250px}
  .viz-card{border-radius:15px}
  .viz-step{min-width:90px;max-width:145px}
}

.assistant-text.streaming{
  min-height:1.8em;
}
.stream-error-note{
  margin-top:8px;
  color:var(--danger);
  font-size:13px;
}
.thinking{color:var(--muted)}
.thinking-shimmer{
  display:inline-block;
  font-weight:500;
  color:transparent;
  background:linear-gradient(100deg,var(--muted) 15%,var(--muted) 38%,var(--text) 50%,var(--muted) 62%,var(--muted) 85%);
  background-size:230% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  animation:thinkingShine 1.35s linear infinite;
}
@keyframes thinkingShine{
  0%{background-position:-90% 0}
  100%{background-position:130% 0}
}
.error{color:var(--danger)}
.message-actions{
  margin-top:7px;
  display:flex;
  align-items:center;
  gap:0;
  direction:ltr;
}
.action-icon{
  width:28px;height:28px;
  border:0;background:transparent;border-radius:7px;
  color:var(--muted);
  display:grid;place-items:center;
}
.action-icon:hover{background:var(--surface-hover);color:var(--text)}
.action-icon.active{color:var(--text);background:var(--surface-hover)}
.composer-home{width:100%}
.composer-shell{
  min-height:130px;
  border:1px solid var(--line-strong);
  background:var(--composer);
  border-radius:26px;
  display:block;
  position:relative;
  padding:0;
  box-shadow:var(--shadow-composer);
  direction:rtl;
  overflow:hidden;
  transition:border-color .15s,box-shadow .15s;
}
.composer-shell:focus-within{
  border-color:color-mix(in srgb,var(--line-strong) 55%,var(--text) 45%);
}
.composer-shell.drag{
  border-color:var(--text);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--text) 12%,transparent),var(--shadow-composer);
}
.composer-input{
  width:100%;
  min-width:0;
  border:0;
  outline:0;
  resize:none;
  background:transparent;
  color:var(--text);
  height:130px;
  min-height:130px;
  max-height:220px;
  margin:0;
  padding:17px 16px 54px 16px;
  line-height:1.5;
  font-size:16px;
  direction:rtl;
  text-align:right;
  vertical-align:top;
  overflow-y:auto;
  display:block;
}
.composer-input::placeholder{color:var(--muted)}
.round-btn{
  width:36px;height:36px;
  border:0;background:transparent;border-radius:50%;
  display:grid;place-items:center;color:var(--icon);
}
.round-btn:hover{background:var(--surface-hover)}
.send-btn{
  width:36px;height:36px;border:0;border-radius:50%;
  background:var(--text);color:var(--bg);
  display:grid;place-items:center;
  transition:opacity .15s,transform .15s;
}
.send-btn:hover:not(:disabled){transform:scale(1.03)}
.send-btn:disabled{opacity:.2;cursor:default}
.composer-shell > .round-btn,
.composer-shell > .send-btn{
  position:absolute;
  bottom:9px;
  z-index:2;
}
.composer-shell > .round-btn:first-child{right:10px}
.composer-shell > .send-btn{left:10px}
#micHome,#micChat{left:51px;right:auto}
.attachments{
  display:none;
  width:100%;
  gap:8px;
  flex-wrap:wrap;
  margin:0 0 8px;
  direction:ltr;
}
.attachments.on{display:flex}
.attachment{
  width:72px;height:72px;position:relative;border-radius:13px;overflow:hidden;
  border:1px solid var(--line);background:var(--surface);
}
.attachment img{width:100%;height:100%;object-fit:cover}
.attachment button{
  position:absolute;top:4px;right:4px;width:22px;height:22px;border:0;border-radius:50%;
  background:rgba(20,20,20,.86);color:#fff;display:grid;place-items:center;font-size:16px;line-height:1;
}
.quick-grid{
  width:min(620px,100%);
  margin:16px auto 0;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}
.quick{
  min-height:48px;
  border:1px solid var(--line);
  background:color-mix(in srgb,var(--surface) 74%,transparent);
  color:var(--text);
  border-radius:15px;
  padding:8px 11px;
  text-align:right;
  font-size:14px;
  display:flex;
  align-items:center;
  gap:9px;
  box-shadow:0 1px 2px rgba(0,0,0,.02);
  transition:transform .16s ease,background .16s ease,border-color .16s ease;
}
.quick:hover{background:var(--surface-hover);border-color:var(--line-strong);transform:translateY(-1px)}
.quick-icon{
  width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;
}
.quick-icon svg{width:17px;height:17px}
.quick-icon.purple{background:#f0e9ff;color:#7950d8}
.quick-icon.green{background:#e5f7ec;color:#21864c}
.quick-icon.orange{background:#fff0df;color:#d66a17}
.quick-icon.blue{background:#e5f1ff;color:#3478c8}
html[data-theme="dark"] .quick-icon.purple{background:#342b48;color:#c2a7ff}
html[data-theme="dark"] .quick-icon.green{background:#203b2a;color:#72d99a}
html[data-theme="dark"] .quick-icon.orange{background:#44301f;color:#ffab68}
html[data-theme="dark"] .quick-icon.blue{background:#21354b;color:#7ab6ff}
.bottom-zone{
  display:none;
  position:absolute;
  left:0;right:0;bottom:0;
  padding:34px 22px 13px;
  background:linear-gradient(to top,var(--bg) 72%,color-mix(in srgb,var(--bg) 86%,transparent) 86%,transparent);
  pointer-events:none;
  z-index:9;
}
.bottom-zone.on{display:block}
.bottom-inner{
  width:min(760px,100%);
  margin:0 auto;
  pointer-events:auto;
  position:relative;
}
.scroll-down{
  position:absolute;
  left:50%;
  top:-44px;
  width:36px;
  height:36px;
  border:1px solid var(--line-strong);
  border-radius:50%;
  background:var(--surface);
  color:var(--text);
  display:grid;
  place-items:center;
  box-shadow:0 5px 18px rgba(0,0,0,.12);
  opacity:0;
  transform:translate(-50%,8px) scale(.92);
  pointer-events:none;
  transition:opacity .16s ease,transform .16s ease,background .16s ease;
  z-index:12;
}
.scroll-down.show{
  opacity:1;
  transform:translate(-50%,0) scale(1);
  pointer-events:auto;
}
.scroll-down:hover{background:var(--surface-hover)}
.scroll-down svg{width:18px;height:18px}
.disclaimer{
  margin-top:9px;
  color:var(--muted);
  text-align:center;
  font-size:11px;
  line-height:1.25;
}
.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.28);
  z-index:25;
  backdrop-filter:blur(1px);
}
.toast{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translate(-50%,12px);
  opacity:0;
  pointer-events:none;
  z-index:100;
  background:var(--text);
  color:var(--bg);
  border:1px solid var(--line);
  border-radius:11px;
  padding:9px 13px;
  font-size:13px;
  box-shadow:var(--shadow);
  transition:.18s ease;
  max-width:min(420px,calc(100vw - 28px));
  text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

.math-modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:220;
  align-items:center;
  justify-content:center;
  padding:28px;
}
.math-modal.open{display:flex}
.math-modal-backdrop{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.48);
  backdrop-filter:blur(13px);
  -webkit-backdrop-filter:blur(13px);
}
.math-modal-card{
  position:relative;
  width:min(1040px,calc(100vw - 56px));
  height:min(720px,calc(100vh - 56px));
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border:1px solid var(--line-strong);
  border-radius:20px;
  background:color-mix(in srgb,var(--surface) 96%,transparent);
  box-shadow:0 28px 90px rgba(0,0,0,.34);
  animation:mathModalIn .18s cubic-bezier(.2,.8,.2,1);
}
@keyframes mathModalIn{
  from{opacity:0;transform:scale(.975) translateY(5px)}
  to{opacity:1;transform:none}
}
.math-modal-toolbar{
  min-height:54px;
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 10px;
  border-bottom:1px solid var(--line);
  direction:ltr;
  flex:none;
}
.math-modal-tool{
  width:36px;
  height:36px;
  border:1px solid var(--line);
  border-radius:9px;
  background:transparent;
  color:var(--text);
  display:grid;
  place-items:center;
  font-size:19px;
  line-height:1;
}
.math-modal-tool:hover{background:var(--surface-hover)}
.math-modal-zoom-label{
  min-width:52px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
  font-variant-numeric:tabular-nums;
}
.math-modal-spacer{flex:1}
.math-modal-viewport{
  flex:1;
  min-height:0;
  overflow:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:44px;
  overscroll-behavior:contain;
}
.math-modal-content{
  direction:ltr;
  unicode-bidi:isolate;
  min-width:max-content;
  color:var(--text);
  text-align:center;
  font-size:32px;
  line-height:1.4;
  transition:font-size .1s ease;
}
.math-modal-content .katex-display{margin:0}
.math-modal-content .katex{font-size:1em}

@media(max-width:860px){
  .app{display:block}
  body.sidebar-collapsed .app{display:block}
  .sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:min(86vw,300px);
    transform:translateX(-105%);
    opacity:1;
    pointer-events:auto;
    box-shadow:20px 0 45px rgba(0,0,0,.14);
  }
  .sidebar.mobile-open{transform:translateX(0)}
  body.sidebar-collapsed .sidebar{transform:translateX(-105%);opacity:1;pointer-events:auto}
  body.sidebar-collapsed .sidebar.mobile-open{transform:translateX(0)}
  .overlay.on{display:block}
  .reopen-sidebar{display:grid}
  .home{padding:18px 14px 125px}
  .home-inner{transform:translateY(-20px)}
  .chat-inner{width:min(100% - 28px,760px);padding-top:14px}
  .bottom-zone{padding:30px 12px 11px}
  .share-btn span{display:none}
  .model-option{min-width:92px;padding-inline:7px}
  .model-info{display:none}
}
@media(max-width:560px){
  .topbar{padding:6px 8px}
  .model-switch{gap:2px;padding:2px}
  .model-option{min-width:74px;min-height:32px;padding:5px 7px}
  .model-name{font-size:11px}
  .home h1{font-size:29px}
  .home-kicker{font-size:13px}
  .quick-grid{grid-template-columns:1fr}
  .quick:nth-child(4){display:none}
  .user-bubble{max-width:88%}
  .chat-inner{width:calc(100% - 22px);padding-bottom:165px}
  .composer-shell{border-radius:24px}
  .composer-input{font-size:16px}
  .user-images img{width:104px;max-height:130px}
}
</style>
</head>
<body>
<div class="overlay" id="overlay"></div>
<div class="toast" id="toast" role="status"></div>

<div class="math-modal" id="mathModal" aria-hidden="true">
  <div class="math-modal-backdrop" id="mathModalBackdrop"></div>
  <div class="math-modal-card" role="dialog" aria-modal="true" aria-label="תצוגת נוסחה מוגדלת">
    <div class="math-modal-toolbar">
      <button class="math-modal-tool" id="mathZoomOut" type="button" aria-label="הקטן">−</button>
      <div class="math-modal-zoom-label" id="mathZoomLabel">100%</div>
      <button class="math-modal-tool" id="mathZoomIn" type="button" aria-label="הגדל">+</button>
      <button class="math-modal-tool" id="mathZoomReset" type="button" aria-label="אפס זום">1:1</button>
      <div class="math-modal-spacer"></div>
      <button class="math-modal-tool" id="mathModalClose" type="button" aria-label="סגור">×</button>
    </div>
    <div class="math-modal-viewport" id="mathModalViewport">
      <div class="math-modal-content" id="mathModalContent"></div>
    </div>
  </div>
</div>

<input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand">
        <img class="brand-mark" id="brandLogo" src="/assets/whitelogo.png" alt="Sifra">
        <span>Sifra</span>
      </div>
      <button class="icon-btn" id="searchBtn" aria-label="חיפוש" title="חיפוש">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
          <circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path>
        </svg>
      </button>
      <button class="icon-btn" id="collapseBtn" aria-label="סגור סרגל צד" title="סגור סרגל צד">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <rect x="3.5" y="4" width="17" height="16" rx="3"></rect><path d="M9 4v16"></path>
        </svg>
      </button>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-btn" id="newChat">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 5H6.8A2.8 2.8 0 0 0 4 7.8v9.4A2.8 2.8 0 0 0 6.8 20h9.4a2.8 2.8 0 0 0 2.8-2.8V9.5"></path>
          <path d="m13 11 7-7"></path><path d="M16 4h4v4"></path>
        </svg>
        <span>שיחה חדשה</span>
      </button>
      <button class="nav-btn" id="libraryBtn">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 5.5h4v13h-4zM10 5.5h4v13h-4zM15.7 4.7l3.2-.8 3.2 12.5-3.2.8z"></path>
        </svg>
        <span>ספרייה</span>
      </button>
      <button class="nav-btn" id="moreBtn">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle>
        </svg>
        <span>עוד</span>
      </button>
      <div class="more-panel" id="morePanel">
        <button class="more-item" id="themeBtn">
          <svg id="themeIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M20.5 15.5A8 8 0 1 1 8.5 3.6a6.6 6.6 0 0 0 12 11.9Z"></path>
          </svg>
          <span id="themeText">מצב כהה</span>
        </button>
      </div>
    </nav>

    <div class="sidebar-sections">
      <button class="section-toggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 6 6 6-6 6"></path></svg>
        <span>מוצמדים</span>
      </button>
      <button class="section-toggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 6 6 6-6 6"></path></svg>
        <span>אחרונים</span>
      </button>
    </div>

    <div class="sidebar-footer">
      <div class="account-menu" id="accountMenu">
        <div class="account-menu-head">
          <div class="avatar">S</div>
          <div class="account-menu-copy">
            <div class="account-menu-title">החשבון שלי</div>
            <div class="account-menu-sub">Sifra</div>
          </div>
        </div>
        <div class="usage-card">
          <div class="usage-title">שימוש</div>
          <div class="usage-row"><span>מגבלה יומית</span><span class="usage-value" id="dailyUsage">— / 150</span></div>
          <div class="usage-track"><div class="usage-fill" id="dailyUsageFill"></div></div>
          <div class="usage-row" style="margin-top:10px"><span>תמונות בהודעה</span><span class="usage-value">עד 2</span></div>
        </div>
        <button class="account-upgrade" id="upgradeBtn">שדרוג התוכנית</button>
        <div class="account-menu-section">
          <div class="account-menu-label">חשבון</div>
          <button class="account-menu-row" id="accountSettings"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"></circle><path d="M19 15.5a1.7 1.7 0 0 0 .3 1.9l.1.1-2 2-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21h-3v-.3a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1-2-2 .1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 4.2 14H4v-3h.2a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 2-2 .1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V4h3v.3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1 2 2-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v3h-.2a1.7 1.7 0 0 0-1.6 1Z"></path></svg><span>הגדרות</span></button>
          <button class="account-menu-row" id="accountTheme"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.5 15.5A8 8 0 1 1 8.5 3.6a6.6 6.6 0 0 0 12 11.9Z"></path></svg><span id="accountThemeText">מצב כהה</span></button>
          <button class="account-menu-row" id="accountLanguage"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"></path></svg><span>שפה</span></button>
          <button class="account-menu-row" id="accountHelp"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"></circle><path d="M9.7 9a2.4 2.4 0 1 1 3.7 2c-.9.6-1.4 1.1-1.4 2M12 17h.01"></path></svg><span>עזרה ותמיכה</span></button>
        </div>
      </div>

      <button class="profile account-trigger" id="accountButton">
        <div class="avatar">S</div>
        <div class="profile-copy">
          <div class="profile-name">החשבון שלי</div>
        </div>
        <svg class="profile-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m8 14 4-4 4 4"></path></svg>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <div class="model-switch" id="modelSwitch" aria-label="בחירת מודל">
          <button class="model-option" data-client-model="sifra-1.5" type="button">
            <span class="model-name">Sifra 1.5</span>
            <span class="model-info">מהיר וקליל</span>
          </button>
          <button class="model-option active" data-client-model="sifra-2" type="button">
            <span class="model-name">Sifra 2</span>
            <span class="model-info">מדויק וחכם יותר</span>
          </button>
        </div>
        <button class="icon-btn reopen-sidebar" id="reopenSidebar" aria-label="פתח סרגל צד" title="פתח סרגל צד">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
            <rect x="3.5" y="4" width="17" height="16" rx="3"></rect><path d="M9 4v16"></path>
          </svg>
        </button>
      </div>
      <div class="topbar-right">
        <button class="share-btn" id="shareBtn">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 15V3"></path><path d="m7 8 5-5 5 5"></path><path d="M5 12v6.5A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V12"></path>
          </svg>
          <span>שיתוף</span>
        </button>
        <button class="icon-btn" id="topMoreBtn" aria-label="עוד" title="עוד">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle>
          </svg>
        </button>
      </div>
    </header>

    <section class="home" id="home">
      <div class="home-inner">
        <h1>מה נפתור היום?</h1>

        <div class="attachments" id="homeAttachments"></div>

        <div class="composer-home">
          <div class="composer-shell" id="homeComposer">
            <button class="round-btn" id="attachHome" aria-label="הוסף תמונה" title="הוסף תמונה">
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
            </button>
            <textarea class="composer-input" id="homeInput" maxlength="7000" placeholder="שאל את Sifra"></textarea>
            <button class="round-btn" id="micHome" aria-label="מיקרופון" title="מיקרופון">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"></path></svg>
            </button>
            <button class="send-btn" id="sendHome" disabled aria-label="שלח">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"></path></svg>
            </button>
          </div>
        </div>

<script>
(function(){
  'use strict';
  const $=function(selector){return document.querySelector(selector)};
  const sidebar=$('#sidebar'),overlay=$('#overlay'),home=$('#home'),chat=$('#chat'),chatInner=$('#chatInner'),bottomZone=$('#bottomZone'),homeInput=$('#homeInput'),chatInput=$('#chatInput'),sendHome=$('#sendHome'),sendChat=$('#sendChat'),fileInput=$('#fileInput'),homeAttachments=$('#homeAttachments'),chatAttachments=$('#chatAttachments'),homeComposer=$('#homeComposer'),chatComposer=$('#chatComposer'),toast=$('#toast'),themeColor=$('#themeColor'),accountMenu=$('#accountMenu'),accountButton=$('#accountButton'),dailyUsage=$('#dailyUsage'),dailyUsageFill=$('#dailyUsageFill'),brandLogo=$('#brandLogo'),scrollDownBtn=$('#scrollDownBtn'),mathModal=$('#mathModal'),mathModalBackdrop=$('#mathModalBackdrop'),mathModalContent=$('#mathModalContent'),mathModalViewport=$('#mathModalViewport'),mathZoomLabel=$('#mathZoomLabel');
  const state={messages:[],images:[],busy:false};
  const MAX_IMAGES=2;

  function esc(value){return String(value).replace(/[&<>"']/g,function(char){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]})}
  function formatTextSegment(text){
    return esc(text).replace(/\n/g,'<br>');
  }
  function renderMathSegment(source,displayMode){
    const math=String(source).trim();
    if(!math)return '';

    if(window.katex){
      try{
        const rendered=window.katex.renderToString(math,{
          throwOnError:false,
          displayMode:displayMode,
          strict:'ignore',
          trust:false,
          output:'htmlAndMathml'
        });
        return '<span class="'+(displayMode?'math-display':'math-inline')+'" data-math="'+encodeURIComponent(math)+'" data-display="'+(displayMode?'1':'0')+'">'+rendered+'</span>';
      }catch(error){}
    }

    return '<span class="'+(displayMode?'math-display':'math-inline')+'" data-math="'+encodeURIComponent(math)+'" data-display="'+(displayMode?'1':'0')+'">'+esc((displayMode?'$$':'$')+source+(displayMode?'$$':'$'))+'</span>';
  }
  function findInlineDollar(source,from){
    for(let i=from;i<source.length;i+=1){
      if(
        source[i]==='$' &&
        source[i-1]!=='\\' &&
        source[i-1]!=='$' &&
        source[i+1]!=='$'
      ){
        return i;
      }
    }
    return -1;
  }
  function stashMath(source){
    const math=[];
    let output='';
    let cursor=0;

    while(cursor<source.length){
      if(
        source.startsWith('$$',cursor) &&
        source[cursor-1]!=='\\'
      ){
        const end=source.indexOf('$$',cursor+2);

        if(end===-1){
          output+=source.slice(cursor);
          break;
        }

        const token='SIFRAMATHTOKEN'+math.length+'END';
        math.push({
          token:token,
          source:source.slice(cursor+2,end),
          display:true
        });
        output+=token;
        cursor=end+2;
        continue;
      }

      if(
        source[cursor]==='$' &&
        source[cursor-1]!=='\\' &&
        source[cursor-1]!=='$' &&
        source[cursor+1]!=='$'
      ){
        const end=findInlineDollar(source,cursor+1);

        if(end===-1){
          output+=source.slice(cursor);
          break;
        }

        const token='SIFRAMATHTOKEN'+math.length+'END';
        math.push({
          token:token,
          source:source.slice(cursor+1,end),
          display:false
        });
        output+=token;
        cursor=end+1;
        continue;
      }

      output+=source[cursor];
      cursor+=1;
    }

    return {markdown:output,math:math};
  }
  function stashVisuals(source){
    const visuals=[];
    let markdown=String(source);

    const specs=[
      {tag:'chart.equation',type:'equation'},
      {tag:'chart.points',type:'points'},
      {tag:'diagram.numberline',type:'numberline'},
      {tag:'diagram.steps',type:'steps'},
      {tag:'diagram.triangle',type:'triangle'}
    ];

    specs.forEach(function(spec){
      const escaped=spec.tag.replace('.', '\\.');
      const regex=new RegExp(
        '<'+escaped+'>\\s*([\\s\\S]*?)\\s*</'+escaped+'>',
        'gi'
      );

      markdown=markdown.replace(
        regex,
        function(_match,payload){
          const token='SIFRAVIZTOKEN'+visuals.length+'END';
          visuals.push({
            token:token,
            type:spec.type,
            payload:String(payload).trim()
          });
          return '\n\n'+token+'\n\n';
        }
      );
    });

    const incomplete=markdown.search(
      /<(?:chart|diagram)\.[a-z]+>[\s\S]*$/i
    );

    if(incomplete!==-1){
      markdown=markdown.slice(0,incomplete);
    }

    return {
      markdown:markdown,
      visuals:visuals
    };
  }

  function vizPlaceholder(item){
    return '<div class="sifra-viz" data-viz-type="'+
      item.type+
      '" data-viz-payload="'+
      encodeURIComponent(item.payload)+
      '"></div>';
  }

  function formatAnswer(text){
    const visuals=stashVisuals(String(text));
    const stashed=stashMath(visuals.markdown);
    let html='';

    if(window.marked&&typeof window.marked.parse==='function'){
      try{
        html=window.marked.parse(stashed.markdown,{
          gfm:true,
          breaks:true
        });
      }catch(error){
        html=formatTextSegment(stashed.markdown);
      }
    }else{
      html=formatTextSegment(stashed.markdown);
    }

    if(window.DOMPurify){
      html=window.DOMPurify.sanitize(html,{
        USE_PROFILES:{html:true}
      });
    }

    stashed.math.forEach(function(item){
      const rendered=renderMathSegment(
        item.source,
        item.display
      );
      html=html.split(item.token).join(rendered);
    });

    visuals.visuals.forEach(function(item){
      const rendered=vizPlaceholder(item);
      html=html
        .split('<p>'+item.token+'</p>')
        .join(rendered);
      html=html
        .split(item.token)
        .join(rendered);
    });

    return html;
  }

  function vizCard(title,subtitle,badge){
    const card=document.createElement('div');
    card.className='viz-card';

    const head=document.createElement('div');
    head.className='viz-head';

    const copy=document.createElement('div');
    copy.className='viz-head-copy';

    const titleEl=document.createElement('div');
    titleEl.className='viz-title';
    titleEl.textContent=title;

    const subtitleEl=document.createElement('div');
    subtitleEl.className='viz-subtitle';
    subtitleEl.textContent=subtitle||'';

    copy.append(titleEl,subtitleEl);

    const badgeEl=document.createElement('div');
    badgeEl.className='viz-badge';
    badgeEl.textContent=badge||'Sifra Visual';

    head.append(copy,badgeEl);

    const body=document.createElement('div');
    body.className='viz-body';

    card.append(head,body);

    return {card:card,body:body};
  }

  function svgNode(name,attrs){
    const node=document.createElementNS(
      'http://www.w3.org/2000/svg',
      name
    );

    Object.entries(attrs||{}).forEach(function(entry){
      node.setAttribute(
        entry[0],
        String(entry[1])
      );
    });

    return node;
  }

  function niceNumber(value){
    if(!Number.isFinite(value))return '';
    if(Math.abs(value)>=1000||(
      Math.abs(value)>0&&
      Math.abs(value)<.01
    )){
      return value.toExponential(1);
    }
    return String(
      Math.round(value*100)/100
    );
  }

  function percentile(values,p){
    if(!values.length)return 0;
    const sorted=values.slice().sort(function(a,b){return a-b});
    const index=Math.max(
      0,
      Math.min(
        sorted.length-1,
        Math.floor(
          (sorted.length-1)*p
        )
      )
    );
    return sorted[index];
  }

  function buildPlotSvg(points,options){
    const width=660;
    const height=330;
    const pad={left:48,right:20,top:20,bottom:36};
    const plotW=width-pad.left-pad.right;
    const plotH=height-pad.top-pad.bottom;

    let xMin=options.xMin;
    let xMax=options.xMax;
    let yMin=options.yMin;
    let yMax=options.yMax;

    if(!(xMax>xMin)){xMin=-10;xMax=10}
    if(!(yMax>yMin)){yMin=-10;yMax=10}

    const svg=svgNode('svg',{
      viewBox:'0 0 '+width+' '+height,
      class:'viz-plot',
      role:'img',
      'aria-label':options.label||'גרף'
    });

    function px(x){
      return pad.left+
        ((x-xMin)/(xMax-xMin))*plotW;
    }

    function py(y){
      return pad.top+
        (1-(y-yMin)/(yMax-yMin))*plotH;
    }

    const grid=svgNode('g',{
      stroke:'currentColor',
      'stroke-opacity':'.09',
      'stroke-width':'1'
    });

    for(let i=0;i<=10;i+=1){
      const gx=pad.left+(plotW*i/10);
      const gy=pad.top+(plotH*i/10);

      grid.append(
        svgNode('line',{
          x1:gx,y1:pad.top,
          x2:gx,y2:pad.top+plotH
        }),
        svgNode('line',{
          x1:pad.left,y1:gy,
          x2:pad.left+plotW,y2:gy
        })
      );
    }

    svg.appendChild(grid);

    const axes=svgNode('g',{
      stroke:'currentColor',
      'stroke-opacity':'.42',
      'stroke-width':'1.2'
    });

    const xAxisY=
      yMin<=0&&yMax>=0
        ? py(0)
        : pad.top+plotH;

    const yAxisX=
      xMin<=0&&xMax>=0
        ? px(0)
        : pad.left;

    axes.append(
      svgNode('line',{
        x1:pad.left,
        y1:xAxisY,
        x2:pad.left+plotW,
        y2:xAxisY
      }),
      svgNode('line',{
        x1:yAxisX,
        y1:pad.top,
        x2:yAxisX,
        y2:pad.top+plotH
      })
    );

    svg.appendChild(axes);

    const labels=svgNode('g',{
      class:'viz-axis-label'
    });

    [
      [pad.left,pad.top+plotH+22,niceNumber(xMin),'start'],
      [pad.left+plotW,pad.top+plotH+22,niceNumber(xMax),'end'],
      [pad.left-7,pad.top+8,niceNumber(yMax),'end'],
      [pad.left-7,pad.top+plotH,niceNumber(yMin),'end']
    ].forEach(function(item){
      const text=svgNode('text',{
        x:item[0],
        y:item[1],
        'text-anchor':item[3]
      });
      text.textContent=item[2];
      labels.appendChild(text);
    });

    svg.appendChild(labels);

    if(options.connect){
      let d='';
      let drawing=false;
      let previousY=null;

      points.forEach(function(point){
        const x=point[0];
        const y=point[1];

        if(
          !Number.isFinite(x)||
          !Number.isFinite(y)||
          y<yMin-(yMax-yMin)*2||
          y>yMax+(yMax-yMin)*2
        ){
          drawing=false;
          previousY=null;
          return;
        }

        const sx=px(x);
        const sy=py(y);

        if(
          previousY!==null&&
          Math.abs(sy-previousY)>plotH*1.25
        ){
          drawing=false;
        }

        d+=
          (drawing?' L ':' M ')+
          sx.toFixed(2)+' '+
          sy.toFixed(2);

        drawing=true;
        previousY=sy;
      });

      const path=svgNode('path',{
        d:d.trim(),
        fill:'none',
        stroke:'currentColor',
        'stroke-width':'2.6',
        'stroke-linecap':'round',
        'stroke-linejoin':'round'
      });

      svg.appendChild(path);
    }

    if(options.points){
      const dots=svgNode('g',{
        fill:'currentColor'
      });

      points.slice(0,220).forEach(function(point){
        if(
          !Number.isFinite(point[0])||
          !Number.isFinite(point[1])||
          point[0]<xMin||
          point[0]>xMax||
          point[1]<yMin||
          point[1]>yMax
        )return;

        dots.appendChild(
          svgNode('circle',{
            cx:px(point[0]),
            cy:py(point[1]),
            r:'4.3'
          })
        );
      });

      svg.appendChild(dots);
    }

    return svg;
  }

  function normalizeEquation(raw){
    let expression=String(raw)
      .trim()
      .replace(/−/g,'-')
      .replace(/π/g,'pi')
      .replace(/^\s*(?:y|f\s*\(\s*x\s*\))\s*=\s*/i,'');

    expression=expression.replace(
      /\bln\s*\(/gi,
      'log('
    );

    const names=
      expression.match(/[A-Za-z_]+/g)||[];

    const allowed=new Set([
      'x','pi','e',
      'sin','cos','tan',
      'asin','acos','atan',
      'sqrt','abs','log','exp',
      'floor','ceil'
    ]);

    if(
      names.some(function(name){
        return !allowed.has(
          name.toLowerCase()
        );
      })
    ){
      throw new Error(
        'הביטוי מכיל פעולה שאינה נתמכת'
      );
    }

    if(
      !/^[0-9A-Za-z_+\-*/^().,\s]+$/.test(
        expression
      )
    ){
      throw new Error(
        'הביטוי אינו נתמך'
      );
    }

    return expression;
  }

  function renderEquationViz(target,payload){
    const shell=vizCard(
      'גרף פונקציה',
      payload,
      'Function'
    );

    target.appendChild(shell.card);

    try{
      if(!window.math){
        throw new Error('מנוע הגרפים עדיין נטען');
      }

      const expression=
        normalizeEquation(payload);

      const compiled=
        window.math.compile(expression);

      const points=[];
      const ys=[];

      for(let i=0;i<=420;i+=1){
        const x=-10+(20*i/420);
        let y=NaN;

        try{
          y=Number(
            compiled.evaluate({x:x})
          );
        }catch(error){}

        if(
          Number.isFinite(y)&&
          Math.abs(y)<1e6
        ){
          ys.push(y);
          points.push([x,y]);
        }else{
          points.push([x,NaN]);
        }
      }

      if(ys.length<3){
        throw new Error(
          'לא ניתן לצייר את הפונקציה'
        );
      }

      let low=percentile(ys,.04);
      let high=percentile(ys,.96);

      if(!(high>low)){
        low-=1;
        high+=1;
      }

      const span=Math.max(
        2,
        high-low
      );

      low-=span*.12;
      high+=span*.12;

      if(low>0&&low<span*.7)low=0;
      if(high<0&&Math.abs(high)<span*.7)high=0;

      shell.body.appendChild(
        buildPlotSvg(
          points,
          {
            xMin:-10,
            xMax:10,
            yMin:low,
            yMax:high,
            connect:true,
            points:false,
            label:'גרף '+payload
          }
        )
      );
    }catch(error){
      const message=document.createElement('div');
      message.className='viz-error';
      message.textContent=
        error.message||
        'לא הצלחתי להציג את הגרף.';
      shell.body.appendChild(message);
    }
  }

  function renderPointsViz(target,payload){
    const shell=vizCard(
      'נקודות במערכת צירים',
      'נתונים ויזואליים',
      'Points'
    );

    target.appendChild(shell.card);

    try{
      const parsed=JSON.parse(payload);
      const raw=Array.isArray(parsed)
        ? parsed
        : parsed.points;

      if(!Array.isArray(raw)){
        throw new Error(
          'פורמט הנקודות אינו תקין'
        );
      }

      const points=raw
        .slice(0,220)
        .map(function(point){
          return [
            Number(point?.[0]),
            Number(point?.[1])
          ];
        })
        .filter(function(point){
          return (
            Number.isFinite(point[0])&&
            Number.isFinite(point[1])
          );
        });

      if(!points.length){
        throw new Error(
          'אין נקודות להצגה'
        );
      }

      const xs=points.map(function(p){return p[0]});
      const ys=points.map(function(p){return p[1]});

      let xMin=Math.min.apply(null,xs);
      let xMax=Math.max.apply(null,xs);
      let yMin=Math.min.apply(null,ys);
      let yMax=Math.max.apply(null,ys);

      const xSpan=Math.max(2,xMax-xMin);
      const ySpan=Math.max(2,yMax-yMin);

      xMin-=xSpan*.15;
      xMax+=xSpan*.15;
      yMin-=ySpan*.15;
      yMax+=ySpan*.15;

      shell.body.appendChild(
        buildPlotSvg(
          points,
          {
            xMin:xMin,
            xMax:xMax,
            yMin:yMin,
            yMax:yMax,
            connect:Boolean(
              parsed?.connect
            ),
            points:true,
            label:'נקודות במערכת צירים'
          }
        )
      );
    }catch(error){
      const message=document.createElement('div');
      message.className='viz-error';
      message.textContent=
        error.message||
        'לא הצלחתי להציג את הנקודות.';
      shell.body.appendChild(message);
    }
  }

  function renderNumberlineViz(target,payload){
    const shell=vizCard(
      'ציר מספרים',
      payload,
      'Number line'
    );

    target.appendChild(shell.card);

    const svg=svgNode('svg',{
      viewBox:'0 0 660 150',
      class:'viz-numberline',
      role:'img',
      'aria-label':'ציר מספרים '+payload
    });

    const y=76;
    const left=44;
    const right=616;

    svg.appendChild(
      svgNode('line',{
        x1:left,y1:y,
        x2:right,y2:y,
        stroke:'currentColor',
        'stroke-width':'2',
        'stroke-opacity':'.55'
      })
    );

    const rangeMatch=
      payload.match(
        /^\s*(-?\d+(?:\.\d+)?)\s*(<=|<)\s*x\s*(<=|<)\s*(-?\d+(?:\.\d+)?)\s*$/i
      );

    const oneMatch=
      payload.match(
        /^\s*x\s*(>=|>|<=|<)\s*(-?\d+(?:\.\d+)?)\s*$/i
      );

    let min=-5;
    let max=5;
    let marks=[];

    if(rangeMatch){
      const a=Number(rangeMatch[1]);
      const b=Number(rangeMatch[4]);
      const span=Math.max(4,b-a);
      min=a-span*.7;
      max=b+span*.7;
      marks=[
        {value:a,closed:rangeMatch[2]==='<='},
        {value:b,closed:rangeMatch[3]==='<='}
      ];
    }else if(oneMatch){
      const value=Number(oneMatch[2]);
      min=value-6;
      max=value+6;
      marks=[
        {
          value:value,
          closed:
            oneMatch[1]==='>='||
            oneMatch[1]==='<='
        }
      ];
    }else{
      const error=document.createElement('div');
      error.className='viz-error';
      error.textContent='לא הצלחתי לקרוא את האי-שוויון.';
      shell.body.appendChild(error);
      return;
    }

    function xPos(value){
      return left+
        ((value-min)/(max-min))*
        (right-left);
    }

    for(let i=0;i<=10;i+=1){
      const value=min+((max-min)*i/10);
      const x=xPos(value);

      svg.appendChild(
        svgNode('line',{
          x1:x,y1:y-6,
          x2:x,y2:y+6,
          stroke:'currentColor',
          'stroke-opacity':'.38'
        })
      );

      if(i%2===0){
        const label=svgNode('text',{
          x:x,
          y:y+25,
          'text-anchor':'middle',
          class:'viz-axis-label'
        });
        label.textContent=niceNumber(value);
        svg.appendChild(label);
      }
    }

    if(rangeMatch){
      const a=Number(rangeMatch[1]);
      const b=Number(rangeMatch[4]);

      svg.appendChild(
        svgNode('line',{
          x1:xPos(a),
          y1:y,
          x2:xPos(b),
          y2:y,
          stroke:'currentColor',
          'stroke-width':'6',
          'stroke-linecap':'round'
        })
      );
    }else{
      const op=oneMatch[1];
      const value=Number(oneMatch[2]);

      svg.appendChild(
        svgNode('line',{
          x1:
            op.startsWith('>')
              ? xPos(value)
              : left,
          y1:y,
          x2:
            op.startsWith('>')
              ? right
              : xPos(value),
          y2:y,
          stroke:'currentColor',
          'stroke-width':'6',
          'stroke-linecap':'round'
        })
      );
    }

    marks.forEach(function(mark){
      svg.appendChild(
        svgNode('circle',{
          cx:xPos(mark.value),
          cy:y,
          r:'7',
          fill:mark.closed
            ? 'currentColor'

  function animateStreamTail(root){
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    const nodes=[];
    let node;
    while((node=walker.nextNode())){
      if(!node.nodeValue||!node.nodeValue.trim())continue;
      const parent=node.parentElement;
      if(parent&&parent.closest('.katex, code, pre, .math-inline, .math-display, .sifra-viz'))continue;
      nodes.push(node);
    }

    let remaining=125;
    for(let i=nodes.length-1;i>=0&&remaining>0;i-=1){
      const textNode=nodes[i];
      const length=textNode.nodeValue.length;
      const take=Math.min(remaining,length);
      if(take<=0)continue;
      const suffix=take===length?textNode:textNode.splitText(length-take);
      const span=document.createElement('span');
      span.className='stream-fade';
      suffix.parentNode.insertBefore(span,suffix);
      span.appendChild(suffix);
      remaining-=take;
    }
  }

  function blobToDataUrl(blob){return new Promise(function(resolve,reject){const reader=new FileReader();reader.onload=function(){resolve(reader.result)};reader.onerror=reject;reader.readAsDataURL(blob)})}
  async function compressImage(file){
    if(!/^image\/(png|jpeg|webp)$/.test(file.type))throw new Error('אפשר להעלות PNG, JPG או WebP בלבד');
    if(file.size>10*1024*1024)throw new Error('התמונה גדולה מדי');
    const bitmap=await createImageBitmap(file),maxSide=1500,scale=Math.min(1,maxSide/Math.max(bitmap.width,bitmap.height));
    const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));
    const context=canvas.getContext('2d');context.fillStyle='#fff';context.fillRect(0,0,canvas.width,canvas.height);context.drawImage(bitmap,0,0,canvas.width,canvas.height);if(bitmap.close)bitmap.close();
    let quality=.82,blob=await new Promise(function(resolve){canvas.toBlob(resolve,'image/jpeg',quality)});
    while(blob&&blob.size>1350000&&quality>.5){quality-=.1;blob=await new Promise(function(resolve){canvas.toBlob(resolve,'image/jpeg',quality)})}
    if(!blob||blob.size>1500000)throw new Error('לא הצלחתי להקטין את התמונה מספיק');
    return {dataUrl:await blobToDataUrl(blob),name:file.name||'image.jpg'};
  }

    let receivedText='';
    let visibleText='';
    let firstToken=false;
    let completed=false;
    let networkFinished=false;
    let flushTimer=0;
    let revealDone=false;
    let resolveReveal;

    const revealFinished=new Promise(function(resolve){resolveReveal=resolve});

    function beginStreaming(){
      if(firstToken)return;

      content.classList.remove('thinking');

      resolveReveal();
    }

    function chooseBurstLength(pendingText){
      const length=pendingText.length;
      let target=length>1200?260:length>500?190:length>180?135:Math.min(105,length);
      if(target>=length)return length;
      const min=Math.max(55,target-35);
      for(let i=target;i>=min;i-=1){
        if(/\s/.test(pendingText[i]||''))return i+1;
      }
      return target;
    }

    function flushBurst(){
      flushTimer=0;
      const pending=receivedText.slice(visibleText.length);

      if(pending.length){
        const take=chooseBurstLength(pending);
        visibleText=receivedText.slice(0,visibleText.length+take);
        renderVisible();
      }

      if(networkFinished&&visibleText.length>=receivedText.length){
        finishReveal();
        return;
      }

      if(receivedText.length>visibleText.length){
        flushTimer=setTimeout(flushBurst,38);
      }
    }

    function scheduleFlush(){
      if(flushTimer||revealDone)return;
      flushTimer=setTimeout(flushBurst,24);
    }

    function markNetworkFinished(){
      networkFinished=true;
      if(!receivedText.length||visibleText.length>=receivedText.length)finishReveal();
      else scheduleFlush();
    }

    function parseEventBlock(block){
      let eventName='message';
      const dataLines=[];
      block.split('\n').forEach(function(line){
        if(line.startsWith('event:'))eventName=line.slice(6).trim();
        else if(line.startsWith('data:'))dataLines.push(line.slice(5).trimStart());
      });
      if(!dataLines.length)return;

      let data={};
      try{data=JSON.parse(dataLines.join('\n'))}catch(error){return}

      if(eventName==='token'){
        const token=typeof data.text==='string'?data.text:'';
        if(!token)return;
        beginStreaming();
        receivedText+=token;
        scheduleFlush();
        return;
      }

      if(eventName==='done'){
        completed=true;
        return;
      }

      if(eventName==='error'){
        const streamError=new Error(data.error||'החיבור למודל נקטע. נסה שוב.');
        streamError.streamError=true;
        throw streamError;
      }
    }

    try{
      const response=await fetch('/api/chat',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          messages:state.messages.slice(-16),
          images:images.map(function(item){return {dataUrl:item.dataUrl}})
        })
      });

      const remaining=response.headers.get('RateLimit-Remaining');
      if(remaining!==null){
        const left=Math.max(0,Math.min(150,Number(remaining)));
        if(Number.isFinite(left)){
          const used=150-left;
          dailyUsage.textContent=used+' / 150';
          dailyUsageFill.style.width=Math.min(100,(used/150)*100)+'%';
        }
      }

      if(!response.ok){
        let data={};
        try{data=await response.json()}catch(error){}
        if(response.status===429&&data.retryAfter){
          throw new Error('שלחת יותר מדי הודעות. נסה שוב בעוד '+data.retryAfter+' שניות.');
        }
        throw new Error(data.error||'לא הצלחתי לקבל תשובה כרגע.');
      }

      if(!response.body)throw new Error('הדפדפן לא קיבל זרם תשובה.');

      const reader=response.body.getReader();
      const decoder=new TextDecoder();
      let buffer='';

      while(true){
        const result=await reader.read();
        if(result.done)break;
        buffer+=decoder.decode(result.value,{stream:true});
        buffer=buffer.replace(/\r\n/g,'\n');

        let boundary;
        while((boundary=buffer.indexOf('\n\n'))!==-1){
          const block=buffer.slice(0,boundary);
          buffer=buffer.slice(boundary+2);
          parseEventBlock(block);
        }
      }

      buffer+=decoder.decode();
      buffer=buffer.replace(/\r\n/g,'\n');
      if(buffer.trim())parseEventBlock(buffer);

      markNetworkFinished();
      await revealFinished;

      if(!receivedText.trim())throw new Error('השרת החזיר תשובה ריקה.');

      content.classList.remove('streaming');
      state.messages.push({role:'assistant',content:receivedText});
      row.appendChild(actionBar(receivedText));
      updateScrollButton();

      if(!completed)console.warn('Sifra stream ended without an explicit done event');
      return receivedText;
    }catch(error){
      markNetworkFinished();

      if(receivedText.trim()){
        await revealFinished;
        content.classList.remove('streaming','thinking');
        const note=document.createElement('div');
        note.className='stream-error-note';
        note.textContent=error.message||'החיבור נקטע. נסה שוב.';
        row.appendChild(note);
        updateScrollButton();
      }else{
        content.classList.remove('streaming','thinking');
        content.classList.add('error');
        content.textContent=error.message||'לא הצלחתי לקבל תשובה.';
      }

      throw error;
    }
  }

  async function submit(input){
    if(state.busy)return;
    const text=input.value.trim()||(state.images.length?'פתור את התרגיל שבתמונה והסבר שלב-שלב.':'');
    if(!text)return;

    const sourceComposer=input===homeInput?homeComposer:chatComposer;
    const sourceRect=sourceComposer.getBoundingClientRect();

    state.busy=true;updateButtons();
    const first=enterChat(),images=state.images.splice(0);renderAttachments();
    const row=addUserMessage(text,images.map(function(item){return item.dataUrl}));
    state.messages.push({role:'user',content:text});
    input.value='';resizeTextarea(input);

    if(first){
      chat.scrollTop=0;
      requestAnimationFrame(function(){requestAnimationFrame(function(){animateComposerDock(sourceRect)})});
    }
    updateScrollButton();

    await new Promise(function(resolve){requestAnimationFrame(function(){requestAnimationFrame(resolve)})});

    const messageMotion=animateUserFlight(sourceRect,row);
    const aiRequest=requestAI(images);

    try{
      await Promise.all([
        messageMotion,
        aiRequest
      ]);
    }catch(error){
      console.warn(
        'Sifra request failed:',
        error?.message || error
      );
    }finally{
      state.busy=false;
      updateButtons();
      updateScrollButton();
      chatInput.focus();
    }
  }

  async function retryLastAnswer(){
    if(state.busy||!state.messages.length)return;
    if(state.messages[state.messages.length-1].role==='assistant'){
      state.messages.pop();
      const rows=chatInner.querySelectorAll('.assistant-row');
      if(rows.length)rows[rows.length-1].remove();
    }
    if(!state.messages.length||state.messages[state.messages.length-1].role!=='user')return;
    state.busy=true;updateButtons();
    try{
      await requestAI([]);
    }catch(error){
      console.warn('Retry failed:',error?.message||error);
    }finally{
      state.busy=false;updateButtons();
      updateScrollButton();
    }
  }

  homeInput.addEventListener('input',function(){resizeTextarea(homeInput);updateButtons()});
  chatInput.addEventListener('input',function(){resizeTextarea(chatInput);updateButtons()});
  [homeInput,chatInput].forEach(function(input){
    input.addEventListener('keydown',function(event){if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();submit(input)}})
  });
  sendHome.addEventListener('click',function(){submit(homeInput)});
  sendChat.addEventListener('click',function(){submit(chatInput)});
  document.querySelectorAll('.quick').forEach(function(button){
    button.addEventListener('click',function(){homeInput.value=button.dataset.prompt||button.textContent.trim();resizeTextarea(homeInput);updateButtons();homeInput.focus()})
  });

  function resetChat(){
    state.messages=[];state.images=[];state.busy=false;chatInner.innerHTML='';chat.classList.remove('on');bottomZone.classList.remove('on');home.style.display='flex';homeInput.value='';chatInput.value='';
    resizeTextarea(homeInput);resizeTextarea(chatInput);renderAttachments();updateButtons();updateScrollButton();
    if(window.innerWidth<=860){sidebar.classList.remove('mobile-open');overlay.classList.remove('on')}
    setTimeout(function(){homeInput.focus()},40);
  }

  $('#newChat').addEventListener('click',resetChat);
  function micNotice(){showToast('קלט קולי יתווסף בהמשך')}
  $('#micHome').addEventListener('click',micNotice);
  $('#micChat').addEventListener('click',micNotice);
  window.addEventListener('resize',function(){if(window.innerWidth>860){sidebar.classList.remove('mobile-open');overlay.classList.remove('on')}});
  updateButtons();
})();
</script>
</body>
