<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fcfcfc" id="themeColor">
<title>Sifra — AI למתמטיקה</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<style>
:root{
  --bg:#fcfcfc;
  --sidebar:#f7f7f8;
  --surface:#ffffff;
  --surface-hover:#ececed;
  --composer:#ffffff;
  --text:#141414;
  --muted:#8b8b8b;
  --muted-2:#a5a5a5;
  --line:#e7e7e7;
  --line-strong:#dbdbdb;
  --user:#e8f3fe;
  --icon:#242424;
  --shadow:0 4px 20px rgba(0,0,0,.06);
  --shadow-composer:0 8px 30px rgba(0,0,0,.07);
  --sidebar-width:260px;
  --danger:#bb2d3b;
}
html[data-theme="dark"]{
  --bg:#111111;
  --sidebar:#111111;
  --surface:#181818;
  --surface-hover:#202020;
  --composer:#181818;
  --text:#eeeeee;
  --muted:#a7a7a7;
  --muted-2:#858585;
  --line:#242424;
  --line-strong:#303030;
  --user:#242424;
  --icon:#eeeeee;
  --shadow:0 4px 20px rgba(0,0,0,.22);
  --shadow-composer:0 10px 35px rgba(0,0,0,.25);
  --danger:#ff7f87;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:"Huninn",ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  font-size:16px;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,textarea,input{font:inherit}
button{color:inherit;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,textarea:focus-visible,input:focus-visible{
  outline:2px solid color-mix(in srgb,var(--text) 35%,transparent);
  outline-offset:2px;
}
svg{display:block}
.app{
  height:100dvh;
  display:grid;
  grid-template-columns:var(--sidebar-width) minmax(0,1fr);
  background:var(--bg);
  direction:ltr;
  transition:grid-template-columns .2s ease;
}
body.sidebar-collapsed .app{grid-template-columns:0 minmax(0,1fr)}
.sidebar{
  direction:ltr;
  position:relative;
  min-width:0;
  width:var(--sidebar-width);
  height:100dvh;
  overflow:hidden;
  border-left:0;
  border-right:1px solid var(--line);
  background:var(--sidebar);
  display:flex;
  flex-direction:column;
  transition:transform .2s ease,opacity .2s ease;
  z-index:30;
}
html[data-theme="dark"] .sidebar{border-right-color:#181818}
body.sidebar-collapsed .sidebar{
  transform:translateX(-100%);
  opacity:0;
  pointer-events:none;
}
.sidebar-head{
  height:52px;
  padding:10px 13px 6px 15px;
  display:flex;
  align-items:center;
  gap:6px;
  direction:ltr;
  flex:none;
}
.brand{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
  margin-right:auto;
  font-size:17px;
  font-weight:700;
  letter-spacing:-.01em;
}
.brand-mark{
  width:28px;
  height:28px;
  object-fit:contain;
  display:block;
  flex:none;
}
.icon-btn{
  width:32px;
  height:32px;
  border:0;
  background:transparent;
  display:grid;
  place-items:center;
  border-radius:8px;
  color:var(--icon);
  flex:none;
}
.icon-btn:hover{background:var(--surface-hover)}
.sidebar-nav{
  padding:9px 10px 0;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.nav-btn{
  height:40px;
  border:0;
  background:transparent;
  border-radius:8px;
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  padding:0 9px;
  color:var(--text);
  font-size:15px;
  font-weight:500;
  text-align:left;
  direction:ltr;
}
.nav-btn span{direction:rtl;unicode-bidi:plaintext}
.nav-btn:hover{background:var(--surface-hover)}
.nav-btn svg{flex:none}
.more-panel{
  display:none;
  margin:3px 4px 0;
  padding:5px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--surface);
  box-shadow:var(--shadow);
}
.more-panel.open{display:block}
.more-item{
  width:100%;
  height:36px;
  border:0;
  background:transparent;
  border-radius:7px;
  padding:0 9px;
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--text);
  font-size:14px;
}
.more-item:hover{background:var(--surface-hover)}
.sidebar-sections{
  padding:13px 10px;
  overflow-y:auto;
  min-height:0;
  flex:1;
}
.section-toggle{
  width:100%;
  border:0;
  background:transparent;
  color:var(--muted);
  height:40px;
  padding:0 6px;
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:4px;
  font-size:14px;
  font-weight:500;
  direction:ltr;
  text-align:left;
}
.section-toggle span{direction:rtl;unicode-bidi:plaintext}
.section-toggle:hover{color:var(--text);background:var(--surface-hover)}
.section-toggle svg{width:14px;height:14px}
.sidebar-footer{
  flex:none;
  padding:8px 9px 10px;
  border-top:1px solid transparent;
}
.profile{
  min-height:48px;
  padding:6px 7px;
  border-radius:9px;
  display:flex;
  align-items:center;
  gap:9px;
  direction:ltr;
}
.profile:hover{background:var(--surface-hover)}
.avatar{
  width:30px;height:30px;border-radius:50%;
  display:grid;place-items:center;
  background:#c7ccd1;color:#fff;
  font-size:11px;font-weight:700;
  flex:none;
}
.profile-copy{
  min-width:0;
  flex:1;
  line-height:1.1;
  direction:ltr;
}
.profile-name{
  font-size:14px;
  font-weight:500;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.profile-plan{
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
}
.profile-action{
  width:30px;height:30px;border:0;background:transparent;border-radius:7px;
  display:grid;place-items:center;color:var(--muted)
}
.profile-action:hover{background:var(--surface)}

.sidebar-footer{position:relative}
.account-trigger{
  width:100%;
  border:0;
  background:transparent;
  text-align:left;
}
.profile-name{direction:rtl;unicode-bidi:plaintext}
.profile-chevron{transition:transform .16s ease;color:var(--muted);flex:none}
.account-trigger.open .profile-chevron{transform:rotate(180deg)}
.account-menu{
  display:none;
  position:absolute;
  left:8px;
  bottom:64px;
  width:calc(100% - 16px);
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  box-shadow:0 14px 45px rgba(0,0,0,.13);
  overflow:hidden;
  z-index:60;
  direction:ltr;
}
.account-menu.open{display:block;animation:accountIn .16s ease-out}
@keyframes accountIn{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
.account-menu-head{
  min-height:58px;
  padding:10px 12px;
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid var(--line);
}
.account-menu-copy{min-width:0;flex:1}
.account-menu-title{font-size:14px;font-weight:600;direction:rtl;unicode-bidi:plaintext}
.account-menu-sub{font-size:12px;color:var(--muted);margin-top:3px}
.usage-card{
  margin:12px;
  padding:12px;
  background:color-mix(in srgb,var(--sidebar) 86%,var(--surface));
  border-radius:10px;
}
.usage-title{font-size:14px;font-weight:600;margin-bottom:10px;direction:rtl;unicode-bidi:plaintext}
.usage-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}
.usage-row span:first-child{direction:rtl;unicode-bidi:plaintext}
.usage-value{color:var(--muted);font-size:12px}
.usage-track{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:7px 0 1px}
.usage-fill{height:100%;width:0%;background:var(--text);border-radius:inherit;transition:width .3s ease}
.account-upgrade{
  width:calc(100% - 24px);
  margin:0 12px 12px;
  height:34px;
  border:1px solid #ff6846;
  color:#ff5a36;
  background:transparent;
  border-radius:8px;
  font-size:13px;
}
.account-upgrade:hover{background:color-mix(in srgb,#ff6846 8%,transparent)}
.account-menu-section{padding:7px 7px;border-top:1px solid var(--line)}
.account-menu-label{padding:5px 7px 4px;color:var(--muted);font-size:11px;direction:rtl;unicode-bidi:plaintext}
.account-menu-row{
  width:100%;min-height:36px;border:0;background:transparent;border-radius:7px;padding:0 8px;
  display:flex;align-items:center;gap:10px;text-align:left;color:var(--text);font-size:13px;
}
.account-menu-row:hover{background:var(--surface-hover)}
.account-menu-row span{direction:rtl;unicode-bidi:plaintext}
.main{
  direction:rtl;
  min-width:0;
  height:100dvh;
  position:relative;
  display:flex;
  flex-direction:column;
  background:var(--bg);
  overflow:hidden;
}
.topbar{
  height:52px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:7px 14px 5px 15px;
  direction:ltr;
  z-index:10;
}
.topbar-left,.topbar-right{display:flex;align-items:center;gap:7px}
.model-switch{
  display:flex;
  align-items:stretch;
  gap:3px;
  padding:3px;
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:13px;
  box-shadow:0 3px 14px rgba(0,0,0,.14);
}
.model-option{
  min-width:108px;
  min-height:38px;
  border:0;
  background:transparent;
  color:var(--muted);
  border-radius:10px;
  padding:5px 9px 4px;
  text-align:left;
  line-height:1.05;
  transition:background .16s ease,color .16s ease,transform .16s ease;
}
.model-option:hover{background:var(--surface-hover);color:var(--text)}
.model-option.active{
  background:var(--surface-hover);
  color:var(--text);
  box-shadow:inset 0 0 0 1px var(--line-strong),0 1px 4px rgba(0,0,0,.08);
}
.model-option:active{transform:scale(.985)}
.model-name{display:block;font-size:12px;font-weight:600;letter-spacing:.01em}
.model-info{display:block;margin-top:3px;font-size:9.5px;color:var(--muted);white-space:nowrap}
.model-option.active .model-info{color:var(--muted)}
.reopen-sidebar{display:none}
body.sidebar-collapsed .reopen-sidebar{display:grid}
.share-btn{
  border:0;
  background:transparent;
  height:34px;
  border-radius:8px;
  padding:0 9px;
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--text);
  font-size:14px;
}
.share-btn:hover{background:var(--surface-hover)}
.home{
  flex:1;
  overflow:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 24px 135px;
}
.home-inner{
  width:min(760px,100%);
  transform:translateY(-38px);
}
.home h1{
  margin:0 0 24px;
  text-align:center;
  font-size:34px;
  font-weight:600;
  letter-spacing:-.025em;
}
.home-kicker{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  margin-bottom:10px;
}
.home-kicker .green{
  display:inline-block;width:7px;height:7px;border-radius:50%;background:#12a150;margin-left:7px;
}
.chat{
  display:none;
  flex:1;
  overflow-y:auto;
  overscroll-behavior:contain;
  scrollbar-width:thin;
  scrollbar-color:var(--line-strong) transparent;
}
.chat.on{display:block}
.chat-inner{
  width:min(760px,calc(100% - 44px));
  margin:0 auto;
  padding:18px 0 175px;
}
.message-row{
  width:100%;
  margin:0 0 31px;
}
.user-row{
  display:flex;
  justify-content:flex-start;
  direction:rtl;
}
.user-bubble{
  max-width:78%;
  background:var(--user);
  border-radius:18px;
  padding:8px 13px 9px;
  font-size:16px;
  line-height:1.55;
  text-align:right;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  box-shadow:0 1px 0 rgba(0,0,0,.015);
}
.user-images{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:8px;
}
.user-images img{
  width:132px;
  max-height:164px;
  object-fit:cover;
  border-radius:12px;
  border:1px solid var(--line);
}
.assistant-row{
  direction:rtl;
  text-align:right;
}
.assistant-text{
  width:100%;
  font-size:16px;
  line-height:1.78;
  white-space:normal;
  overflow-wrap:anywhere;
}
.assistant-text p{margin:0 0 .85em}
.assistant-text p:last-child{margin-bottom:0}
.assistant-text h1,
.assistant-text h2,
.assistant-text h3,
.assistant-text h4{
  line-height:1.3;
  margin:1.15em 0 .5em;
  letter-spacing:-.015em;
}
.assistant-text h1:first-child,
.assistant-text h2:first-child,
.assistant-text h3:first-child{margin-top:0}
.assistant-text h1{font-size:1.48em}
.assistant-text h2{font-size:1.3em}
.assistant-text h3{font-size:1.14em}
.assistant-text h4{font-size:1.04em}
.assistant-text strong{font-weight:700}
.assistant-text em{font-style:italic}
.assistant-text ul,
.assistant-text ol{
  margin:.55em 0 .9em;
  padding-right:1.55em;
  padding-left:0;
}
.assistant-text li{margin:.18em 0}
.assistant-text li > p{margin:.2em 0}
.assistant-text blockquote{
  margin:.85em 0;
  padding:.2em .9em .2em 0;
  border-right:3px solid var(--line-strong);
  color:var(--muted);
}
.assistant-text hr{
  border:0;
  border-top:1px solid var(--line);
  margin:1.2em 0;
}
.assistant-text code{
  direction:ltr;
  unicode-bidi:isolate;
  font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  font-size:.88em;
  background:var(--surface-hover);
  border:1px solid var(--line);
  border-radius:6px;
  padding:.12em .35em;
}
.assistant-text pre{
  direction:ltr;
  text-align:left;
  overflow:auto;
  margin:.85em 0;
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--surface);
}
.assistant-text pre code{
  padding:0;
  border:0;
  background:transparent;
  font-size:13px;
  white-space:pre;
}
.assistant-text table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  margin:.9em 0 1.1em;
  border:1px solid var(--line-strong);
  border-radius:11px;
  overflow:hidden;
  font-size:.94em;
}
.assistant-text th,
.assistant-text td{
  padding:9px 11px;
  text-align:right;
  vertical-align:top;
  border-bottom:1px solid var(--line);
  border-left:1px solid var(--line);
}
.assistant-text th{
  background:var(--surface-hover);
  font-weight:700;
}
.assistant-text tr:last-child td{border-bottom:0}
.assistant-text th:last-child,
.assistant-text td:last-child{border-left:0}
.assistant-text a{
  color:inherit;
  text-decoration:underline;
  text-underline-offset:2px;
}
.assistant-text .math-inline{
  direction:ltr;
  unicode-bidi:isolate;
  display:inline-block;
  vertical-align:middle;
  margin:0 .08em;
}
.assistant-text .math-display{
  direction:ltr;
  unicode-bidi:isolate;
  display:block;
  width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  margin:.7em 0;
  padding:2px 0 5px;
  text-align:center;
}
.assistant-text .math-display .katex-display{margin:0}
.assistant-text .katex{font-size:1.03em}
.assistant-text.streaming{
  min-height:1.8em;
}
.stream-error-note{
  margin-top:8px;
  color:var(--danger);
  font-size:13px;
}
.thinking{color:var(--muted)}
.thinking-shimmer{
  display:inline-block;
  font-weight:500;
  color:transparent;
  background:linear-gradient(100deg,var(--muted) 15%,var(--muted) 38%,var(--text) 50%,var(--muted) 62%,var(--muted) 85%);
  background-size:230% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  animation:thinkingShine 1.35s linear infinite;
}
@keyframes thinkingShine{
  0%{background-position:-90% 0}
  100%{background-position:130% 0}
}
.error{color:var(--danger)}
.message-actions{
  margin-top:7px;
  display:flex;
  align-items:center;
  gap:0;
  direction:ltr;
}
.action-icon{
  width:28px;height:28px;
  border:0;background:transparent;border-radius:7px;
  color:var(--muted);
  display:grid;place-items:center;
}
.action-icon:hover{background:var(--surface-hover);color:var(--text)}
.action-icon.active{color:var(--text);background:var(--surface-hover)}
.composer-home{width:100%}
.composer-shell{
  min-height:130px;
  border:1px solid var(--line-strong);
  background:var(--composer);
  border-radius:26px;
  display:block;
  position:relative;
  padding:0;
  box-shadow:var(--shadow-composer);
  direction:rtl;
  overflow:hidden;
  transition:border-color .15s,box-shadow .15s;
}
.composer-shell:focus-within{
  border-color:color-mix(in srgb,var(--line-strong) 55%,var(--text) 45%);
}
.composer-shell.drag{
  border-color:var(--text);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--text) 12%,transparent),var(--shadow-composer);
}
.composer-input{
  width:100%;
  min-width:0;
  border:0;
  outline:0;
  resize:none;
  background:transparent;
  color:var(--text);
  height:130px;
  min-height:130px;
  max-height:220px;
  margin:0;
  padding:17px 16px 54px 16px;
  line-height:1.5;
  font-size:16px;
  direction:rtl;
  text-align:right;
  vertical-align:top;
  overflow-y:auto;
  display:block;
}
.composer-input::placeholder{color:var(--muted)}
.round-btn{
  width:36px;height:36px;
  border:0;background:transparent;border-radius:50%;
  display:grid;place-items:center;color:var(--icon);
}
.round-btn:hover{background:var(--surface-hover)}
.send-btn{
  width:36px;height:36px;border:0;border-radius:50%;
  background:var(--text);color:var(--bg);
  display:grid;place-items:center;
  transition:opacity .15s,transform .15s;
}
.send-btn:hover:not(:disabled){transform:scale(1.03)}
.send-btn:disabled{opacity:.2;cursor:default}
.composer-shell > .round-btn,
.composer-shell > .send-btn{
  position:absolute;
  bottom:9px;
  z-index:2;
}
.composer-shell > .round-btn:first-child{right:10px}
.composer-shell > .send-btn{left:10px}
#micHome,#micChat{left:51px;right:auto}
.attachments{
  display:none;
  width:100%;
  gap:8px;
  flex-wrap:wrap;
  margin:0 0 8px;
  direction:ltr;
}
.attachments.on{display:flex}
.attachment{
  width:72px;height:72px;position:relative;border-radius:13px;overflow:hidden;
  border:1px solid var(--line);background:var(--surface);
}
.attachment img{width:100%;height:100%;object-fit:cover}
.attachment button{
  position:absolute;top:4px;right:4px;width:22px;height:22px;border:0;border-radius:50%;
  background:rgba(20,20,20,.86);color:#fff;display:grid;place-items:center;font-size:16px;line-height:1;
}
.quick-grid{
  width:min(620px,100%);
  margin:16px auto 0;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}
.quick{
  min-height:48px;
  border:1px solid var(--line);
  background:color-mix(in srgb,var(--surface) 74%,transparent);
  color:var(--text);
  border-radius:15px;
  padding:8px 11px;
  text-align:right;
  font-size:14px;
  display:flex;
  align-items:center;
  gap:9px;
  box-shadow:0 1px 2px rgba(0,0,0,.02);
  transition:transform .16s ease,background .16s ease,border-color .16s ease;
}

}

  function blobToDataUrl(blob){return new Promise(function(resolve,reject){const reader=new FileReader();reader.onload=function(){resolve(reader.result)};reader.onerror=reject;reader.readAsDataURL(blob)})}
  async function compressImage(file){
    if(!/^image\/(png|jpeg|webp)$/.test(file.type))throw new Error('אפשר להעלות PNG, JPG או WebP בלבד');
    if(file.size>10*1024*1024)throw new Error('התמונה גדולה מדי');
    const bitmap=await createImageBitmap(file),maxSide=1500,scale=Math.min(1,maxSide/Math.max(bitmap.width,bitmap.height));
    const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));
    const context=canvas.getContext('2d');context.fillStyle='#fff';context.fillRect(0,0,canvas.width,canvas.height);context.drawImage(bitmap,0,0,canvas.width,canvas.height);if(bitmap.close)bitmap.close();
    let quality=.82,blob=await new Promise(function(resolve){canvas.toBlob(resolve,'image/jpeg',quality)});
    while(blob&&blob.size>1350000&&quality>.5){quality-=.1;blob=await new Promise(function(resolve){canvas.toBlob(resolve,'image/jpeg',quality)})}
    if(!blob||blob.size>1500000)throw new Error('לא הצלחתי להקטין את התמונה מספיק');
    return {dataUrl:await blobToDataUrl(blob),name:file.name||'image.jpg'};
  }

  async function requestAI(images){
    const row=addAssistantMessage('',{thinking:true});
    const content=row.querySelector('.assistant-text');

    let receivedText='';
    let visibleText='';
    let firstToken=false;
    let completed=false;
    let networkFinished=false;
    let revealFrame=0;
    let revealBudget=0;
    let lastRevealTime=0;
    let revealDone=false;
    let resolveReveal;
    const revealFinished=new Promise(function(resolve){
      resolveReveal=resolve;
    });

    function beginStreaming(){
      if(firstToken)return;
      firstToken=true;
      content.classList.remove('thinking');
      content.classList.add('streaming');
      content.innerHTML='';
    }

    function renderVisible(){
      content.innerHTML=
        formatAnswer(visibleText);
      updateScrollButton();
    }

    function finishReveal(){
      if(revealDone)return;
      revealDone=true;
      revealFrame=0;
      renderVisible();
      resolveReveal();
    }

    function revealTick(now){
      if(!lastRevealTime)lastRevealTime=now;

      const delta=Math.min(
        50,
        Math.max(0,now-lastRevealTime)
      );

      lastRevealTime=now;

      const pending=
        receivedText.length-
        visibleText.length;

      if(pending>0){
        const speed=
          pending>900
            ? 92
            : pending>350
              ? 80
              : 68;

        revealBudget+=
          speed*(delta/1000);

        let count=
          Math.floor(revealBudget);

        if(count>0){
          count=Math.min(
            count,
            pending,
            4
          );

          revealBudget-=count;

          visibleText=
            receivedText.slice(
              0,
              visibleText.length+count
            );

          renderVisible();
        }
      }

      if(
        networkFinished &&
        visibleText.length>=receivedText.length
      ){
        finishReveal();
        return;
      }

      revealFrame=
        requestAnimationFrame(
          revealTick
        );
    }

    function ensureRevealLoop(){
      if(revealFrame||revealDone)return;
      lastRevealTime=0;
      revealFrame=
        requestAnimationFrame(
          revealTick
        );
    }

    function markNetworkFinished(){
      networkFinished=true;

      if(
        !receivedText.length ||
        visibleText.length>=receivedText.length
      ){
        finishReveal();
      }else{
        ensureRevealLoop();
      }
    }

    function parseEventBlock(block){
      let eventName='message';
      const dataLines=[];

      block.split('\n').forEach(function(line){
        if(line.startsWith('event:')){
          eventName=
            line.slice(6).trim();
        }else if(line.startsWith('data:')){
          dataLines.push(
            line.slice(5).trimStart()
          );
        }
      });

      if(!dataLines.length)return;

      let data={};

      try{
        data=JSON.parse(
          dataLines.join('\n')
        );
      }catch(error){
        return;
      }

      if(eventName==='token'){
        const token=
          typeof data.text==='string'
            ? data.text
            : '';

        if(!token)return;

        beginStreaming();
        receivedText+=token;
        ensureRevealLoop();
        return;
      }

      if(eventName==='done'){
        completed=true;
        return;
      }

      if(eventName==='error'){
        const streamError=
          new Error(
            data.error ||
            'החיבור למודל נקטע. נסה שוב.'
          );

        streamError.streamError=true;
        throw streamError;
      }
    }

    try{
      const response=await fetch('/api/chat',{
        method:'POST',
        headers:{
          'Content-Type':'application/json'
        },
        body:JSON.stringify({
          messages:
            state.messages.slice(-16),
          images:images.map(function(item){
            return {
              dataUrl:item.dataUrl
            };
          })
        })
      });

      const remaining=
        response.headers.get(
          'RateLimit-Remaining'
        );

      if(remaining!==null){
        const left=Math.max(
          0,
          Math.min(
            150,
            Number(remaining)
          )
        );

        if(Number.isFinite(left)){
          const used=150-left;

          dailyUsage.textContent=
            used+' / 150';

          dailyUsageFill.style.width=
            Math.min(
              100,
              (used/150)*100
            )+'%';
        }
      }

      if(!response.ok){
        let data={};

        try{
          data=await response.json();
        }catch(error){}

        if(
          response.status===429 &&
          data.retryAfter
        ){
          throw new Error(
            'שלחת יותר מדי הודעות. נסה שוב בעוד '+
            data.retryAfter+
            ' שניות.'
          );
        }

        throw new Error(
          data.error ||
          'לא הצלחתי לקבל תשובה כרגע.'
        );
      }

      if(!response.body){
        throw new Error(
          'הדפדפן לא קיבל זרם תשובה.'
        );
      }

      const reader=
        response.body.getReader();

      const decoder=
        new TextDecoder();

      let buffer='';

      while(true){
        const result=
          await reader.read();

        if(result.done)break;

        buffer+=decoder.decode(
          result.value,
          {stream:true}
        );

        buffer=
          buffer.replace(/\r\n/g,'\n');

        let boundary;

        while(
          (boundary=
            buffer.indexOf('\n\n')
          )!==-1
        ){
          const block=
            buffer.slice(0,boundary);

          buffer=
            buffer.slice(boundary+2);

          parseEventBlock(block);
        }
      }

      buffer+=decoder.decode();
      buffer=
        buffer.replace(/\r\n/g,'\n');

      if(buffer.trim()){
        parseEventBlock(buffer);
      }

      markNetworkFinished();
      await revealFinished;

      if(!receivedText.trim()){
        throw new Error(
          'השרת החזיר תשובה ריקה.'
        );
      }

      content.classList.remove(
        'streaming'
      );

      state.messages.push({
        role:'assistant',
        content:receivedText
      });

      row.appendChild(
        actionBar(receivedText)
      );

      updateScrollButton();

      if(!completed){
        console.warn(
          'Sifra stream ended without an explicit done event'
        );
      }

      return receivedText;
    }catch(error){
      markNetworkFinished();

      if(receivedText.trim()){
        await revealFinished;

        content.classList.remove(
          'streaming',
          'thinking'
        );

        const note=
          document.createElement('div');

        note.className=
          'stream-error-note';

        note.textContent=
          error.message ||
          'החיבור נקטע. נסה שוב.';

        row.appendChild(note);
        updateScrollButton();
      }else{
        content.classList.remove(
          'streaming',
          'thinking'
        );

        content.classList.add(
          'error'
        );

        content.textContent=
          error.message ||
          'לא הצלחתי לקבל תשובה.';
      }

      throw error;
    }
  }

  async function submit(input){
    if(state.busy)return;
    const text=input.value.trim()||(state.images.length?'פתור את התרגיל שבתמונה והסבר שלב-שלב.':'');
    if(!text)return;

    const sourceComposer=input===homeInput?homeComposer:chatComposer;
    const sourceRect=sourceComposer.getBoundingClientRect();

    state.busy=true;updateButtons();
    const first=enterChat(),images=state.images.splice(0);renderAttachments();
    const row=addUserMessage(text,images.map(function(item){return item.dataUrl}));
    state.messages.push({role:'user',content:text});
    input.value='';resizeTextarea(input);

    if(first){
      chat.scrollTop=0;
      requestAnimationFrame(function(){requestAnimationFrame(function(){animateComposerDock(sourceRect)})});
    }
    updateScrollButton();

    await new Promise(function(resolve){requestAnimationFrame(function(){requestAnimationFrame(resolve)})});

    const messageMotion=animateUserFlight(sourceRect,row);
    const aiRequest=requestAI(images);

    try{
      await Promise.all([
        messageMotion,
        aiRequest
      ]);
    }catch(error){
      console.warn(
        'Sifra request failed:',
        error?.message || error
      );
    }finally{
      state.busy=false;
      updateButtons();
      updateScrollButton();
      chatInput.focus();
    }
  }

  async function retryLastAnswer(){
    if(state.busy||!state.messages.length)return;
    if(state.messages[state.messages.length-1].role==='assistant'){
      state.messages.pop();
      const rows=chatInner.querySelectorAll('.assistant-row');
      if(rows.length)rows[rows.length-1].remove();
    }
    if(!state.messages.length||state.messages[state.messages.length-1].role!=='user')return;
    state.busy=true;updateButtons();
    try{
      await requestAI([]);
    }catch(error){
      console.warn('Retry failed:',error?.message||error);
    }finally{
      state.busy=false;updateButtons();
      updateScrollButton();
    }
  }

  homeInput.addEventListener('input',function(){resizeTextarea(homeInput);updateButtons()});
  chatInput.addEventListener('input',function(){resizeTextarea(chatInput);updateButtons()});
  [homeInput,chatInput].forEach(function(input){
    input.addEventListener('keydown',function(event){if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();submit(input)}})
  });
  sendHome.addEventListener('click',function(){submit(homeInput)});
  sendChat.addEventListener('click',function(){submit(chatInput)});
  document.querySelectorAll('.quick').forEach(function(button){
    button.addEventListener('click',function(){homeInput.value=button.dataset.prompt||button.textContent.trim();resizeTextarea(homeInput);updateButtons();homeInput.focus()})
  });

  function resetChat(){
    state.messages=[];state.images=[];state.busy=false;chatInner.innerHTML='';chat.classList.remove('on');bottomZone.classList.remove('on');home.style.display='flex';homeInput.value='';chatInput.value='';
    resizeTextarea(homeInput);resizeTextarea(chatInput);renderAttachments();updateButtons();updateScrollButton();
    if(window.innerWidth<=860){sidebar.classList.remove('mobile-open');overlay.classList.remove('on')}
    setTimeout(function(){homeInput.focus()},40);
  }

  $('#newChat').addEventListener('click',resetChat);
  function micNotice(){showToast('קלט קולי יתווסף בהמשך')}
  $('#micHome').addEventListener('click',micNotice);
  $('#micChat').addEventListener('click',micNotice);
  window.addEventListener('resize',function(){if(window.innerWidth>860){sidebar.classList.remove('mobile-open');overlay.classList.remove('on')}});
  updateButtons();
})();
</script>
</body>
</html>
